parameters:
  rbac:
    =_metadata:
      multi_tenant: true

    namespace: default
    manageNamespace: false

    serviceaccounts: {}
    clusterroles: {}
    clusterrolebindings: {}
    roles: {}
    rolebindings: {}

    namespaceSync:
      ignoreNames: []
      ignorePrefixes:
        - kube
        - openshift
        - appuio
        - syn
      labelPrefix: set.rbac.syn.tools/
      policies: {}
      policySets: {}
